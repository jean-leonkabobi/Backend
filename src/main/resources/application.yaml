# src/main/resources/application.yml
spring:
  application:
    name: bank-security-backend
  
  # Configuration PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banksecurity}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Configuration JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: UTC
    open-in-view: false
    show-sql: ${SHOW_SQL:false}

  # Configuration Email
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Configuration Multipart (upload fichiers)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuration Serveur
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

# Configuration JWT
jwt:
  secret: ${JWT_SECRET:votreSecretTresLongEtComplexePourJWTToken2024!}
  expiration: 3600000  # 1 heure en millisecondes
  refresh-expiration: 86400000  # 24 heures

# Configuration IA Service
ia:
  service:
    url: ${IA_SERVICE_URL:http://localhost:8000}
    timeout: 5000

# Configuration Stockage
storage:
  images-path: ${STORAGE_IMAGES:./storage/images}
  videos-path: ${STORAGE_VIDEOS:./storage/videos}
  max-image-size: 10MB
  max-video-size: 100MB

# Configuration Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Configuration Logging
logging:
  level:
    com.banksecurity: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/application.log
    max-size: 10MB
    max-history: 30

# Configuration OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method