# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine  # PostgreSQL 16 pour Spring Boot 4
    container_name: banksecurity-postgres
    environment:
      POSTGRES_DB: banksecurity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: banksecurity-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banksecurity
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage

  ia-python:
    build: ./ia-python
    container_name: banksecurity-ia
    environment:
      JAVA_API_URL: http://backend-java:8080/api
      DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    depends_on:
      - backend-java

volumes:
  postgres_data: